name = "iptv-crawler"
main = "src/index.js"
compatibility_date = "2024-09-23"

# ============ KV 命名空间 ============
# 部署前先执行: npx wrangler kv namespace create KV
# 然后把返回的 id 填到下面
[[kv_namespaces]]
binding = "KV"
id = "2a9bd91a994847ed9d750ba350b09425"

# ============ 定时任务（UTC 时间，北京时间 +8）============
# 16:30 UTC = 北京时间 00:30，每天凌晨全量抓取一次
# 每 2 小时跑一次测速分片（轮换检测部分频道源）
[triggers]
crons = ["30 16 * * *", "0 */2 * * *"]

# ============ 可调参数 ============
[vars]
MAX_SOURCES_PER_CHANNEL = "8"     # 输出 M3U 时每个频道最多保留的源数量
MAX_PROBE_PER_CHANNEL = "6"       # 每个频道最多进入测速队列的源数量
CHECK_BATCH = "35"                # 每轮测速检测的 URL 数量（免费版单请求 50 子请求上限，需留余量）
CHECK_TIMEOUT_MS = "3500"         # 单个源测速超时（毫秒）
CRAWL_CRON = "30 16 * * *"        # 与上面第一个 cron 保持一致，用于区分定时任务类型
EPG_URL = "https://live.fanmingming.com/e.xml"   # EPG 节目单地址，写入 M3U 头部
